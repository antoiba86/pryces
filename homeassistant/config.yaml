name: Pryces Portfolio
version: "0.1.0"
slug: pryces
description: Multi-broker portfolio and net-worth tracker — positions, P&L, dividends, XIRR/TWR
url: https://github.com/antoiba86/pryces
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# Served through ingress, so the dashboard appears in the Home Assistant sidebar
# behind Home Assistant's own authentication and nothing is exposed on the LAN.
ingress: true
ingress_port: 8000
panel_icon: mdi:chart-line
panel_title: Portfolio
options:
  max_fetch_workers: 2
  cache_ttl_seconds: 300
  cache_closed_ttl_seconds: 3600
  cache_fx_ttl_seconds: 3600
  log_level: info
  telegram_bot_token: ""
  telegram_group_id: ""
schema:
  max_fetch_workers: int(1,16)
  cache_ttl_seconds: int(0,)
  cache_closed_ttl_seconds: int(0,)
  cache_fx_ttl_seconds: int(0,)
  log_level: list(critical|error|warning|info|debug|trace)
  telegram_bot_token: str?
  telegram_group_id: str?
